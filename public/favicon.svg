<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background Badge com cantos arredondados sutis estilo Zed -->
  <rect width="32" height="32" rx="7" fill="#0c0e10" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#22262b" />

  <!-- Conexão Relacional Ortogonal (Ciano Técnico) -->
  <path d="M 14 11 H 22 V 17" stroke="#38bdf8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="22" cy="17" r="1.5" fill="#38bdf8" />
  <circle cx="14" cy="11" r="1.5" fill="#38bdf8" />

  <!-- Tabela 1: Topo Esquerdo (Entidade Primária) -->
  <rect x="4" y="6" width="10" height="10" rx="2" fill="#16191d" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="4" y1="9.5" x2="14" y2="9.5" stroke="#38bdf8" stroke-width="1" />
  <line x1="6.5" y1="12.5" x2="10" y2="12.5" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" />

  <!-- Tabela 2: Fundo Direito (Entidade Relacionada) -->
  <rect x="18" y="16" width="10" height="10" rx="2" fill="#16191d" stroke="#818cf8" stroke-width="1.5" />
  <line x1="18" y1="19.5" x2="28" y2="19.5" stroke="#818cf8" stroke-width="1" />
  <line x1="20.5" y1="22.5" x2="24" y2="22.5" stroke="#ededed" stroke-width="1" stroke-linecap="round" />
</svg>
